[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501", # line length (handled pragmatically)
]

[tool.ruff.lint.per-file-ignores]
"pokemon_camera_scanner.py" = ["B905"]

