<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RareSwap – Pokémon kortpriser</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
    <meta name="theme-color" content="#ef4444" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RareSwap" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}" />
  </head>
  <body>
    <main class="container">
      <header class="brand">
        <div class="pokeball" aria-hidden="true"></div>
        <div class="brand-text">
          <h1>RareSwap</h1>
          <p>Find prisen på dit Pokémon-kort på sekunder</p>
        </div>
      </header>

      <section class="card">
        <h2 class="section-title">🔍 Søg på kortnavn</h2>
        <form class="form" action="{{ url_for('pricing.lookup') }}" method="get">
          <div class="row">
            <input
              id="q"
              name="q"
              class="input"
              placeholder="Fx Charizard"
              autocomplete="off"
              required
            />
            <input
              id="set"
              name="set"
              class="input"
              placeholder="Sæt (valgfrit)"
              autocomplete="off"
            />
            <select id="currency" name="currency" class="select" aria-label="Vælg valuta">
              {% for code, sym in currencies.items() %}
                <option value="{{ code }}" {% if code == currency %}selected{% endif %}>{{ code }} ({{ sym }})</option>
              {% endfor %}
            </select>
            <button class="button" type="submit">Søg</button>
          </div>
          <p class="hint">Tilføj sætnavn for at finde et specifikt kort — fx "Charmander" + "FireRed &amp; LeafGreen"</p>
        </form>
      </section>

      <div class="divider-label">eller</div>

      {% include "_webcam_scanner.html" %}

      <div class="divider-label">eller</div>

      <section class="card" id="pi-camera-section">
        <h2 class="section-title">Pi kamera scan</h2>
        <div class="webcam-preview-wrap" id="pi-preview-wrap" hidden>
          <img id="pi-stream" alt="Pi kamera live" style="width:100%;border-radius:8px;" />
        </div>
        <div class="row" style="margin-top:0.75rem">
          <button class="button" id="pi-start-btn" type="button">Start kamera</button>
          <button class="button scan-btn" id="pi-scan-btn" type="button" disabled>Scan kort</button>
          <button class="button secondary" id="pi-stop-btn" type="button" disabled>Stop</button>
        </div>
        <p class="webcam-status muted" id="pi-scan-status" role="status"></p>
        <div id="pi-scan-confirm" hidden>
          <p class="confirm-label">Fandt: <strong id="pi-scan-name"></strong></p>
          <div class="row">
            <button class="button" id="pi-scan-go-set" type="button">Søg med sæt</button>
            <button class="button secondary" id="pi-scan-go-name" type="button">Søg alle versioner</button>
          </div>
        </div>
      </section>
      <script>
        (function () {
          var startBtn = document.getElementById("pi-start-btn");
          var scanBtn = document.getElementById("pi-scan-btn");
          var stopBtn = document.getElementById("pi-stop-btn");
          var status = document.getElementById("pi-scan-status");
          var confirm = document.getElementById("pi-scan-confirm");
          var nameEl = document.getElementById("pi-scan-name");
          var goSet = document.getElementById("pi-scan-go-set");
          var goName = document.getElementById("pi-scan-go-name");
          var streamImg = document.getElementById("pi-stream");
          var previewWrap = document.getElementById("pi-preview-wrap");
          var lastResult = {};

          function stopStream() {
            streamImg.src = "";
            previewWrap.hidden = true;
            scanBtn.disabled = true;
            stopBtn.disabled = true;
            startBtn.disabled = false;
          }

          startBtn.addEventListener("click", function () {
            previewWrap.hidden = false;
            streamImg.src = "/api/pi-camera-stream";
            startBtn.disabled = true;
            scanBtn.disabled = false;
            stopBtn.disabled = false;
            status.textContent = "Hold kortet foran kameraet og tryk Scan kort.";
            confirm.hidden = true;
          });

          stopBtn.addEventListener("click", function () {
            stopStream();
            status.textContent = "";
          });

          scanBtn.addEventListener("click", function () {
            status.textContent = "Scanner kort...";
            scanBtn.disabled = true;
            confirm.hidden = true;
            fetch("/api/pi-camera-scan", { method: "POST", headers: { "Content-Type": "application/json" } })
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data.error) { status.textContent = data.error; return; }
                lastResult = data;
                nameEl.textContent = data.name + (data.set ? ' (' + data.set + ')' : '');
                status.textContent = "";
                confirm.hidden = false;
              })
              .catch(function (e) { status.textContent = "Fejl: " + e.message; })
              .finally(function () { scanBtn.disabled = false; });
          });

          goSet.addEventListener("click", function () {
            if (!lastResult.name) return;
            var url = "/lookup?q=" + encodeURIComponent(lastResult.name);
            if (lastResult.set) url += "&set=" + encodeURIComponent(lastResult.set);
            window.location.href = url;
          });

          goName.addEventListener("click", function () {
            if (!lastResult.name) return;
            window.location.href = "/lookup?q=" + encodeURIComponent(lastResult.name);
          });
        })();
      </script>

      <footer class="footer">
        <span class="muted">
          <a href="{{ url_for('pricing.status') }}">Status</a>
        </span>
      </footer>
    </main>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/static/sw.js");
      }
    </script>
  </body>
</html>
