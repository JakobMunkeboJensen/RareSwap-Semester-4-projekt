<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login – Pokémon pris-scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="container">
      <header class="brand">
        <div class="pokeball" aria-hidden="true"></div>
        <div class="brand-text">
          <h1>Login</h1>
          <p>Log ind for at bruge din profil-side.</p>
        </div>
      </header>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <section class="card {% if messages[0][0] == 'error' %}danger{% endif %}">
            {% for category, message in messages %}
              <p class="{% if category == 'error' %}" style="margin: 0;"{% endif %}>{{ message }}</p>
            {% endfor %}
          </section>
        {% endif %}
      {% endwith %}

      <section class="card">
        <form class="form" action="{{ url_for('auth.login_post') }}" method="post">
          <input type="hidden" name="next" value="{{ next or '' }}" />

          <label class="label" for="username">Brugernavn</label>
          <div class="row">
            <input id="username" name="username" class="input" autocomplete="username" required />
          </div>

          <label class="label" for="password" style="margin-top: 12px;">Adgangskode</label>
          <div class="row">
            <input id="password" name="password" type="password" class="input" autocomplete="current-password" required />
          </div>

          <div class="row" style="margin-top: 12px;">
            <button class="button" type="submit">Log ind</button>
            <a class="button secondary" href="{{ url_for('auth.register') }}">Opret bruger</a>
            <a class="button secondary" href="{{ url_for('auth.forgot_password') }}">Glemt kodeord?</a>
            <a class="button secondary" href="{{ url_for('pricing.home') }}">Forside</a>
          </div>
        </form>
      </section>

      <footer class="footer">
        <span class="muted">Endpoint: <code>/login</code></span>
      </footer>
    </main>
  </body>
</html>
